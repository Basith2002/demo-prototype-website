<!-- DHANVANT HERBAL — NAVBAR COMPONENT (one file, loaded into every page via <div id="nav">) -->
<div class="bg-leaf-900 text-leaf-100 text-[11px] tracking-widest uppercase overflow-hidden py-2"><div id="nv-mq" class="mq whitespace-nowrap"></div></div>

<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-leaf-100">
 <div class="max-w-7xl mx-auto px-4 h-[72px] flex items-center justify-between gap-3">
  <div class="flex-1 flex items-center gap-7">
   <button onclick="menu(1)" aria-label="Menu" class="lg:hidden text-leaf-800 text-2xl p-1"><i class="fa-solid fa-bars"></i></button>
   <nav id="nv-links" class="hidden lg:flex gap-8 text-[11px] font-semibold tracking-[.2em] uppercase text-leaf-700"></nav>
  </div>
  <a href="index.html" class="text-center leading-none"><span class="font-serif text-xl sm:text-2xl font-bold text-leaf-800 tracking-[.2em]">DHANVANT</span><br><span class="text-[9px] tracking-[.55em] text-gold-600 font-semibold">HERBAL</span></a>
  <div class="flex-1 flex justify-end items-center gap-4 sm:gap-6 text-leaf-700">
   <button onclick="toggleSearch()" aria-label="Search"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
   <a href="favourites.html" aria-label="Favourites" class="relative"><i class="fa-regular fa-heart text-xl"></i><span id="wc" class="hidden absolute -top-2 -right-2.5 bg-rose-500 text-white text-[10px] font-bold w-[18px] h-[18px] rounded-full flex items-center justify-center">0</span></a>
   <a href="cart.html" aria-label="Bag" class="relative"><i class="fa-solid fa-bag-shopping text-xl"></i><span id="cc" class="hidden absolute -top-2 -right-2.5 bg-leaf-800 text-white text-[10px] font-bold w-[18px] h-[18px] rounded-full flex items-center justify-center">0</span></a>
   <div id="nv-user" class="relative"></div>
  </div>
 </div>
 <div id="sb" class="hidden px-4 pb-3"><form onsubmit="navSearch(event)"><input id="q" placeholder="Search ashwagandha, tulsi, hair oil…" class="inp max-w-xl mx-auto block !rounded-full"></form></div>
</header>

<!-- SLIDE MENU -->
<div id="mm" class="fixed inset-0 z-[300] pointer-events-none lg:hidden" aria-hidden="true">
 <div id="mo" onclick="menu(0)" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300"></div>
 <aside id="md" class="absolute left-0 top-0 h-full w-[84%] max-w-sm bg-white shadow-2xl flex flex-col -translate-x-full transition-transform duration-300 ease-out">
  <div class="flex items-center justify-between px-5 h-[72px] border-b border-leaf-100 flex-shrink-0"><div class="leading-none"><span class="font-serif text-2xl font-bold text-leaf-800 tracking-[.2em]">DHANVANT</span><br><span class="text-[9px] tracking-[.55em] text-gold-600 font-semibold">HERBAL</span></div><button onclick="menu(0)" aria-label="Close menu" class="w-10 h-10 rounded-full hover:bg-leaf-50 text-leaf-800"><i class="fa-solid fa-xmark text-xl"></i></button></div>
  <div class="flex-1 overflow-y-auto px-5 py-5 text-sm font-medium text-leaf-900">
   <p class="text-[10px] font-semibold tracking-[.3em] text-gold-600 uppercase mb-1">Menu</p><div id="md-links"></div>
   <p class="text-[10px] font-semibold tracking-[.3em] text-gold-600 uppercase mt-6 mb-1">Shop by Need</p><div id="md-cats"></div>
   <p class="text-[10px] font-semibold tracking-[.3em] text-gold-600 uppercase mt-6 mb-1">My Account</p>
   <a href="favourites.html" class="flex items-center gap-3 py-3 border-b border-leaf-100"><i class="fa-regular fa-heart w-5 text-leaf-500"></i>Favourites</a>
   <a href="cart.html" class="flex items-center gap-3 py-3 border-b border-leaf-100"><i class="fa-solid fa-bag-shopping w-5 text-leaf-500"></i>Shopping Bag</a>
  </div>
  <div id="md-auth" class="px-5 py-4 border-t border-leaf-100 bg-leaf-50 flex-shrink-0"></div>
 </aside>
</div>

<script>
/* navbar behaviour — uses CATS / CI from the page's main script */
(function(){
 const g=id=>document.getElementById(id);
 let u=null;try{u=JSON.parse(localStorage.getItem('dh_user'))}catch(e){}
 const pg=location.pathname.split('/').pop()||'index.html';
 const L=[['index.html','Home','fa-house'],['shop.html','Shop','fa-store'],['categories.html','Categories','fa-layer-group'],['about.html','About Us','fa-leaf']];
 g('nv-mq').innerHTML='<span class="px-8">🌿 Free shipping over ₹499</span><span class="px-8">Code <b class="text-gold-400">DHANVANT10</b> for 10% off</span><span class="px-8">100% Ayurvedic · No parabens</span><span class="px-8">AYUSH certified</span>'.repeat(4);
 g('nv-links').innerHTML=L.map(([h,t])=>`<a href="${h}" class="${h===pg?'text-gold-600':''} hover:text-gold-600 transition">${t.replace(' Us','')}</a>`).join('');
 g('md-links').innerHTML=L.map(([h,t,i])=>`<a href="${h}" class="flex items-center gap-3 py-3 border-b border-leaf-100 ${h===pg?'text-gold-600':''}"><i class="fa-solid ${i} w-5 text-leaf-500"></i>${t}</a>`).join('');
 g('md-cats').innerHTML=CATS.map(c=>`<a href="shop.html?cat=${encodeURIComponent(c)}" class="flex items-center gap-3 py-2.5 border-b border-leaf-100 text-stone-600"><i class="fa-solid ${CI[c]} w-5 text-leaf-500"></i>${c}</a>`).join('');
 g('nv-user').innerHTML=u
  ?`<button onclick="event.stopPropagation();document.getElementById('um').classList.toggle('hidden')" aria-label="Account" class="flex items-center"><span class="w-9 h-9 rounded-full bg-leaf-800 text-gold-400 text-sm font-bold flex items-center justify-center">${u.name[0].toUpperCase()}</span></button>
    <div id="um" class="hidden absolute right-0 mt-3 w-52 bg-white border border-leaf-100 rounded-2xl shadow-xl p-4 text-sm"><p class="text-[10px] uppercase tracking-widest text-green-600 font-semibold">Signed in</p><p class="font-semibold truncate">${u.name}</p><p class="text-xs text-stone-400 truncate mb-2">${u.email}</p><a href="favourites.html" class="block py-1.5 hover:text-gold-600">Favourites</a><a href="cart.html" class="block py-1.5 hover:text-gold-600">My Bag</a><button onclick="signOut()" class="mt-2 pt-2 border-t border-leaf-100 w-full text-left text-red-500">Sign Out</button></div>`
  :`<a href="signin.html" aria-label="Sign in" title="Sign In" class="hover:text-gold-600 transition"><i class="fa-regular fa-user text-xl"></i></a>`;
 g('md-auth').innerHTML=u
  ?`<p class="text-[10px] uppercase tracking-widest text-green-600 font-semibold">Signed in</p><p class="font-semibold truncate">${u.name}</p><p class="text-xs text-stone-400 truncate mb-3">${u.email}</p><button onclick="signOut()" class="btn btn-o w-full !py-2.5">Sign Out</button>`
  :`<a href="signin.html" class="btn btn-g w-full block mb-2">Sign In</a><a href="signup.html" class="btn btn-o w-full block">Create Account</a>`;
 document.addEventListener('click',()=>{const m=g('um');m&&m.classList.add('hidden')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(0)});
})();
function menu(o){const m=document.getElementById('mm');m.classList.toggle('pointer-events-none',!o);m.setAttribute('aria-hidden',!o);document.getElementById('mo').classList.toggle('opacity-0',!o);document.getElementById('md').classList.toggle('-translate-x-full',!o);document.body.style.overflow=o?'hidden':'';}
function toggleSearch(){const s=document.getElementById('sb');s.classList.toggle('hidden');if(!s.classList.contains('hidden'))document.getElementById('q').focus();}
function navSearch(e){e.preventDefault();location.href='shop.html?q='+encodeURIComponent(document.getElementById('q').value);}
</script>
