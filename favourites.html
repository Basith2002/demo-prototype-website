<body>
<div id="site-navbar"></div>
<div class="bg-cream-100 border-b border-cream-200 py-10"><div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-end justify-between flex-wrap gap-4">
 <div><button onclick="goBack()" class="inline-flex items-center gap-2 mb-4 text-xs font-semibold tracking-widest uppercase text-stone-500 hover:text-yellow-600 transition-colors"><i class="fa-solid fa-arrow-left"></i> Back</button>
<p class="text-xs font-semibold tracking-[0.4em] text-yellow-600 uppercase mb-2">Your Curation</p>
  <h1 class="font-serif text-4xl font-light">Favourites</h1><p id="count-text" class="text-stone-400 text-sm mt-1"></p></div>
 <div class="flex gap-3">
  <button onclick="addAll()" id="add-all-btn" class="hidden px-6 py-3 bg-stone-900 text-cream-50 rounded-full text-sm font-semibold hover:bg-yellow-600 transition-colors">Add All to Bag</button>
  <button onclick="clearAll()" id="clear-btn" class="hidden px-6 py-3 border border-stone-200 text-stone-600 rounded-full text-sm font-semibold hover:border-red-400 hover:text-red-500 transition-colors">Clear All</button></div></div></div>
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
 <div id="empty-state" class="hidden flex-col items-center justify-center py-24 text-center fade-up">
  <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mb-6"><i class="fa-regular fa-heart text-4xl text-red-300"></i></div>

  <p class="text-stone-400 text-sm mb-8 max-w-xs">Tap the heart on any piece to save it here for later.</p>
  <a href="index.html#collections" onclick="return guardShop(event)" class="px-8 py-3.5 bg-stone-900 text-cream-50 rounded-full text-sm font-semibold hover:bg-yellow-600 transition-colors">Browse Collection</a></div>
 <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
</div>
<script>
/* ---- shared data + helpers ---- */
const FREE_SHIPPING_MIN = 150;

const PRODUCTS = [

 {id:3,name:"Wide-Leg Pleated Worsted Trousers",category:"Pants",price:260,original_price:290,badge:"New Arrival",fiber:"SUPER 130s",fabric:"Super 130s Worsted Wool",image:"https://images.unsplash.com/photo-1506630448388-4e683c67ddb0?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=600&q=80",description:"Contemporary high-rise cut with deep forward double pleats and a fluid drape over boots.",sizes:["28","30","32","34"],colors:[{name:"Deep Navy",hex:"#161b2b"},{name:"Stone Grey",hex:"#4e4e4e"}]},
 {id:4,name:"480GSM Minimalist Heavyweight Hoodie",category:"Knitwear",price:195,original_price:null,badge:"Essentials",fiber:"FRENCH TERRY",fabric:"100% Organic French Terry Cotton",image:"https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80",description:"Zero branding. Pure architectural silhouette with a double-layered crossover hood.",sizes:["S","M","L","XL"],colors:[{name:"Vintage Washed Black",hex:"#222222"},{name:"Bone White",hex:"#f0ede6"}]},

 {id:8,name:"Drop-Shoulder Heavy Cotton Tee",category:"Shirts",price:95,original_price:null,badge:"Essential",fiber:"310GSM COTTON",fabric:"310GSM Single Jersey Cotton",image:"https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80",description:"Substantial 310GSM combed cotton with a high ribbed collar that holds its shape.",sizes:["XS","S","M","L","XL"],colors:[{name:"Vintage Black",hex:"#1f1f1f"},{name:"Ecru",hex:"#eeebe3"}]},
 {id:9,name:"Italian Brushed Mohair Cardigan",category:"Knitwear",price:340,original_price:380,badge:"Trending",fiber:"KID MOHAIR",fabric:"70% Kid Mohair, 30% Virgin Wool",image:"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&w=600&q=80",description:"Fluffy kid mohair knitted in Biella with real horn buttons and deep ribbing.",sizes:["S","M","L"],colors:[{name:"Sage Earth",hex:"#5a6859"},{name:"Smoky Charcoal",hex:"#363636"}]},
 {id:10,name:"Tailored Wool Cargo Trousers",category:"Pants",price:285,original_price:null,badge:"New",fiber:"WOOL FLANNEL",fabric:"100% Wool Flannel",image:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1506630448388-4e683c67ddb0?auto=format&fit=crop&w=600&q=80",description:"Elevated cargo silhouette with concealed bellows pockets and adjustable hem drawcords.",sizes:["30","32","34"],colors:[{name:"Charcoal Melange",hex:"#303030"},{name:"Olive Ash",hex:"#44463d"}]},
 {id:11,name:"Full-Grain Leather Weekend Duffle",category:"Accessories",price:650,original_price:720,badge:"Crafted",fiber:"TUSCAN LEATHER",fabric:"Hand-Waxed Tuscan Leather",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&w=600&q=80",description:"Heirloom travel bag with heavy brass YKK Excella zippers and reinforced straps.",sizes:["45L"],colors:[{name:"Cognac Amber",hex:"#7a4622"},{name:"Onyx Black",hex:"#111111"}]},
 {id:12,name:"Titanium Geometric Sunglasses",category:"Accessories",price:240,original_price:null,badge:"Capsule",fiber:"BETA-TITANIUM",fabric:"Japanese Beta-Titanium, Zeiss Lenses",image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80",image2:"https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80",description:"Ultralight 14g frames with anti-reflective Carl Zeiss gradient lenses, UV400.",sizes:["One Size"],colors:[{name:"Brushed Gold",hex:"#c5a059"},{name:"Matte Black",hex:"#1c1c1c"}]}
];

/* ---------- storage (one format everywhere) ----------
   cart item : {id,name,price,image,category,color,size,qty}
   wishlist  : [productId, ...]                                   */
function _read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function loadCart(){
  return _read('atelier_cart',[]).map(i=>{
    const p=PRODUCTS.find(x=>x.id===i.id)||{};
    return {id:i.id,name:i.name||p.name,price:parseFloat(i.price??p.price),image:i.image||i.image1||p.image,
            category:i.category||p.category||'',color:i.color||'',size:i.size||'',qty:i.qty||i.quantity||1};
  }).filter(i=>i.name);
}
function persistCart(c){localStorage.setItem('atelier_cart',JSON.stringify(c));updateNavCounts();}
function loadWish(){
  return [...new Set(_read('atelier_wishlist',[]).map(w=>(w&&typeof w==='object')?w.id:w))]
    .filter(id=>PRODUCTS.some(p=>p.id===id));
}
function persistWish(w){localStorage.setItem('atelier_wishlist',JSON.stringify(w));updateNavCounts();}
function getUser(){return _read('atelier_user',null);}
/* ---------- login gate: send guests to sign in, then bring them back ---------- */
/* "Browse Collection" / "Continue Shopping" buttons: guests are sent to sign in first */
function guardShop(e){
  if(!getUser()){e.preventDefault();goSignin('index.html#collections',null,'Please sign in or create an account to continue shopping.');return false;}
  return true;
}
/* page-level Back button: previous page, or the home page if there is none */
function goBack(){
  let same=false;try{same=document.referrer&&new URL(document.referrer).origin===location.origin;}catch(e){}
  if(history.length>1&&same)history.back(); else location.href='index.html';
}
function goSignin(next,pending,msg){
  localStorage.setItem('atelier_next',next||'index.html');
  if(pending) localStorage.setItem('atelier_pending',JSON.stringify(pending)); else localStorage.removeItem('atelier_pending');
  localStorage.setItem('atelier_msg',msg||'Please sign in to continue.');
  location.href='signin.html';
}
function takeNext(){const n=localStorage.getItem('atelier_next')||'index.html';localStorage.removeItem('atelier_next');localStorage.removeItem('atelier_msg');return n;}
function getAuthMsg(){return localStorage.getItem('atelier_msg')||'';}
function consumePending(type){
  const p=_read('atelier_pending',null);
  if(p&&p.type===type){localStorage.removeItem('atelier_pending');return p;}
  return null;
}

/* ---------- toast ---------- */
function showToast(msg){
  let c=document.getElementById('toast-container');
  if(!c){c=document.createElement('div');c.id='toast-container';document.body.appendChild(c);}
  const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500);
}

/* badge refresh (the navbar itself lives in navbar.html) */
function updateNavCounts(){
  const n=loadCart().reduce((s,i)=>s+i.qty,0), w=loadWish().length;
  [['nav-cart-count',n],['nav-wishlist-count',w]].forEach(([id,v])=>{const el=document.getElementById(id);if(el){el.textContent=v;el.classList.toggle('hidden',v===0);}});
}
/* global look for toasts + smooth anchor scrolling */
(function(){const st=document.createElement('style');st.textContent=`html{scroll-behavior:smooth;scroll-padding-top:72px}
#toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{background:#1c1917;color:#fdfaf5;padding:12px 24px;border-radius:50px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:toastIn .3s ease;font-family:'Plus Jakarta Sans',sans-serif}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}`;document.head.appendChild(st);})();

/* load the navbar COMPONENT (navbar.html) into <div id="site-navbar"> */
function loadNavbar(){
  const host=document.getElementById('site-navbar');
  fetch('navbar.html').then(r=>{if(!r.ok)throw 0;return r.text()}).then(html=>{
    const tmp=document.createElement('div');tmp.innerHTML=html;
    const codes=[...tmp.querySelectorAll('script')].map(s=>s.textContent);
    tmp.querySelectorAll('script').forEach(s=>s.remove());
    host.replaceWith(...tmp.childNodes);
    codes.forEach(c=>{const s=document.createElement('script');s.textContent=c;document.body.appendChild(s);});
  }).catch(()=>{host.innerHTML='<div style="padding:14px;text-align:center;font-size:13px;background:#fff3cd;color:#7a5b00">Navbar could not load. Open the site through a local server (e.g. VS Code “Live Server”) — browsers block loading navbar.html when a page is opened as a plain file.</div>';});
}
</script>
<script>
loadNavbar();
let wishlist=loadWish(), cart=loadCart();
const $=id=>document.getElementById(id);
function render(){
 const n=wishlist.length, empty=!n;
 $('count-text').textContent=n+' saved piece'+(n===1?'':'s');
 $('empty-state').classList.toggle('hidden',!empty); $('empty-state').classList.toggle('flex',empty);
 $('grid').classList.toggle('hidden',empty);
 $('add-all-btn').classList.toggle('hidden',empty); $('clear-btn').classList.toggle('hidden',empty);
 $('grid').innerHTML=wishlist.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean).map((p,k)=>{
  const c=cart.find(x=>x.id===p.id), off=p.original_price?Math.round((1-p.price/p.original_price)*100):0;
  return `<div class="product-card fade-up" style="animation-delay:${k*0.05}s">
   <div class="relative"><img src="${p.image}" alt="${p.name}" class="h-56 w-full object-cover bg-cream-100">
    ${p.badge?`<span class="absolute top-2 left-2 bg-stone-900 text-cream-50 text-[9px] font-bold tracking-widest px-2 py-0.5 rounded-full uppercase">${p.badge}</span>`:''}
    ${off?`<span class="absolute bottom-2 left-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">-${off}%</span>`:''}
    <button onclick="removeFav(${p.id})" title="Remove" class="absolute top-2 right-2 w-8 h-8 bg-white rounded-full shadow flex items-center justify-center text-red-500 hover:bg-red-50"><i class="fa-solid fa-heart text-sm"></i></button></div>
   <div class="p-4"><p class="text-[10px] font-semibold tracking-widest text-stone-400 uppercase mb-0.5">${p.category}</p>
    <h3 class="font-serif text-base font-medium leading-tight mb-1 line-clamp-1">${p.name}</h3>
    <p class="text-xs text-stone-400 line-clamp-2 mb-3">${p.description}</p>
    <div class="flex items-center gap-1.5 mb-3"><span class="text-sm font-bold">$${p.price.toFixed(2)}</span>
     ${p.original_price?`<span class="text-xs text-stone-400 line-through">$${p.original_price.toFixed(2)}</span>`:''}</div>
    ${c?`<div class="flex items-center justify-between bg-cream-100 rounded-xl p-2">
      <button onclick="qty(${p.id},-1)" class="w-7 h-7 rounded-lg bg-white border border-cream-200 font-bold hover:border-yellow-500">−</button>
      <span class="text-xs font-semibold text-stone-700">✓ ${c.qty} in bag</span>
      <button onclick="qty(${p.id},1)" class="w-7 h-7 rounded-lg bg-white border border-cream-200 font-bold hover:border-yellow-500">+</button></div>`
     :`<button onclick="qty(${p.id},1)" class="w-full py-2.5 bg-stone-900 text-cream-50 rounded-xl text-xs font-semibold hover:bg-yellow-600 transition-colors">+ Add to Bag</button>`}
   </div></div>`;}).join('');
}
function removeFav(id){wishlist=wishlist.filter(x=>x!==id);persistWish(wishlist);render();showToast('Removed from favourites');}
function qty(id,d){
 const p=PRODUCTS.find(x=>x.id===id); let c=cart.find(x=>x.id===id);
 if(c){c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);}
 else if(d>0){cart.push({id:p.id,name:p.name,price:p.price,image:p.image,category:p.category,color:p.colors[0].name,size:p.sizes[0],qty:1});showToast('Added to bag');}
 persistCart(cart);render();
}
function addAll(){
 wishlist.forEach(id=>{if(!cart.some(x=>x.id===id)){const p=PRODUCTS.find(x=>x.id===id);cart.push({id:p.id,name:p.name,price:p.price,image:p.image,category:p.category,color:p.colors[0].name,size:p.sizes[0],qty:1});}});
 persistCart(cart);render();showToast('✓ All favourites are in your bag');
}
function clearAll(){if(!confirm('Remove all items from your favourites?'))return;wishlist=[];persistWish(wishlist);render();showToast('Favourites cleared');}
window.addEventListener('atelier:update',()=>{wishlist=loadWish();cart=loadCart();render();});
render();
</script></body></html>
